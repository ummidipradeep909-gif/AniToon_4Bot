# Docker Secrets overlay for compose.production.yaml.
# Create ./secrets/* files on the host (chmod 600); never commit them.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  redis:
    environment:
      REDIS_PASSWORD: ""
    command:
      - sh
      - -ec
      - 'exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"'
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
    secrets: [redis_password]
  policy:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/policy_database_url
      REDIS_URL: ""
      REDIS_URL_FILE: /run/secrets/policy_redis_url
      AI_SERVICE_TOKEN: ""
      AI_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [policy_database_url, policy_redis_url, ai_service_token, openai_api_key]
  bot:
    environment:
      BOT_TOKEN: ""
      BOT_TOKEN_FILE: /run/secrets/bot_token
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: ""
      REDIS_URL_FILE: /run/secrets/redis_url
      AI_SERVICE_TOKEN: ""
      AI_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
      CLONE_ENCRYPTION_KEY: ""
      CLONE_ENCRYPTION_KEY_FILE: /run/secrets/clone_encryption_key
      WEBHOOK_SECRET_TOKEN: ""
      WEBHOOK_SECRET_TOKEN_FILE: /run/secrets/webhook_secret_token
    secrets:
      - bot_token
      - database_url
      - redis_url
      - ai_service_token
      - clone_encryption_key
      - webhook_secret_token

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  database_url:
    file: ./secrets/database_url
  policy_database_url:
    file: ./secrets/policy_database_url
  redis_url:
    file: ./secrets/redis_url
  policy_redis_url:
    file: ./secrets/policy_redis_url
  bot_token:
    file: ./secrets/bot_token
  ai_service_token:
    file: ./secrets/ai_service_token
  openai_api_key:
    file: ./secrets/openai_api_key
  clone_encryption_key:
    file: ./secrets/clone_encryption_key
  webhook_secret_token:
    file: ./secrets/webhook_secret_token
